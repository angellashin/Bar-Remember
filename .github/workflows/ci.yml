name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Select the Swift toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Run tests
        run: swift test
